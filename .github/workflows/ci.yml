name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Vet
        run: go vet ./...

      # 快速单元测试（无 race，覆盖全部包）
      - name: Test
        run: go test -count=1 -timeout 5m ./...

      # 竞态检测：只跑纯逻辑包（SQLite 在 race 下极慢，排除 cache）
      - name: Test with race detector (pure logic packages)
        run: |
          go test -race -count=1 -timeout 5m \
            ./internal/asr/... \
            ./internal/autoreply/... \
            ./internal/config/... \
            ./internal/dto/... \
            ./internal/telegram/... \
            ./internal/trust/... \
            ./internal/wake/...

      - name: Build (linux/amd64)
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -o /tmp/tgmcp ./cmd/tgmcp

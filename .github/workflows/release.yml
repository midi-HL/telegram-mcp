name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v1.0.0）'
        required: true

permissions:
  contents: write

jobs:
  # 按 OS 分组并行编译，避免单个 job 跑 19 个架构超时
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: "386",    arm: '' }
          - { arch: amd64,    arm: '' }
          - { arch: arm,      arm: '6' }
          - { arch: arm,      arm: '7' }
          - { arch: arm64,    arm: '' }
          - { arch: loong64,  arm: '' }
          - { arch: ppc64le,  arm: '' }
          - { arch: riscv64,  arm: '' }
          - { arch: s390x,    arm: '' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.arm }}
        run: |
          SUFFIX="${{ matrix.arch }}${{ matrix.arm }}"
          VERSION="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_REF_TYPE}" != "tag" ] && VERSION="dev-${GITHUB_SHA::7}"
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
            -o "dist/tgmcp" ./cmd/tgmcp
          cd dist
          tar czf "tgmcp-${VERSION}-linux-${SUFFIX}.tar.gz" tgmcp
          sha256sum "tgmcp-${VERSION}-linux-${SUFFIX}.tar.gz" > "tgmcp-${VERSION}-linux-${SUFFIX}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}${{ matrix.arm }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  build-other:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: "386",   ext: .exe, fmt: zip  }
          - { goos: windows, goarch: amd64,   ext: .exe, fmt: zip  }
          - { goos: windows, goarch: arm64,   ext: .exe, fmt: zip  }
          - { goos: darwin,  goarch: amd64,   ext: '',   fmt: tgz  }
          - { goos: darwin,  goarch: arm64,   ext: '',   fmt: tgz  }
          - { goos: freebsd, goarch: "386",   ext: '',   fmt: tgz  }
          - { goos: freebsd, goarch: amd64,   ext: '',   fmt: tgz  }
          - { goos: freebsd, goarch: arm64,   ext: '',   fmt: tgz  }
          - { goos: netbsd,  goarch: amd64,   ext: '',   fmt: tgz  }
          - { goos: openbsd, goarch: amd64,   ext: '',   fmt: tgz  }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_REF_TYPE}" != "tag" ] && VERSION="dev-${GITHUB_SHA::7}"
          ARCH="${{ matrix.goarch }}"
          [ "$ARCH" = "amd64" ] && ARCH="x86_64"
          [ "$ARCH" = "386" ] && ARCH="i386"
          OS="${{ matrix.goos }}"
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
            -o "dist/tgmcp${{ matrix.ext }}" ./cmd/tgmcp
          cd dist
          NAME="tgmcp-${VERSION}-${OS}-${ARCH}"
          if [ "${{ matrix.fmt }}" = "zip" ]; then
            zip -q "${NAME}.zip" "tgmcp${{ matrix.ext }}"
            sha256sum "${NAME}.zip" > "${NAME}.zip.sha256"
          else
            tar czf "${NAME}.tar.gz" "tgmcp${{ matrix.ext }}"
            sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create Release
    needs: [build-linux, build-other]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release
        run: |
          mkdir -p release
          # 用 find 收集所有压缩包（避免 glob 不匹配时静默失败）
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          cd release
          echo "=== 收集到的文件 ==="
          ls -lh
          COUNT=$(ls -1 *.tar.gz *.zip 2>/dev/null | wc -l)
          echo "共 $COUNT 个压缩包"
          if [ "$COUNT" -lt 19 ]; then
            echo "::error::期望 19 个产物，实际只有 $COUNT 个"
            exit 1
          fi
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## Telegram MCP ${{ github.ref_name }}

            通过 MCP 让 AI 操作真实的 Telegram 账号。

            **支持平台（19 个架构，全部经本地实测验证）**

            | OS | 架构 | 格式 |
            |---|---|---|
            | Linux | x86_64, i386, armv6, armv7, arm64, loong64, ppc64le, riscv64, s390x | tar.gz |
            | Windows | x86_64, i386, arm64 | zip |
            | macOS | x86_64, arm64 | tar.gz |
            | FreeBSD | x86_64, i386, arm64 | tar.gz |
            | NetBSD | x86_64 | tar.gz |
            | OpenBSD | x86_64 | tar.gz |

            **不支持的架构**（依赖 `modernc.org/libc` 无实现）：
            `linux/mips`、`linux/mipsle`、`linux/mips64`、`linux/mips64le`、`linux/ppc64`、`netbsd/arm64`

            **快速开始**：解压后运行 `tgmcp auth --qr` 登录，然后配置 MCP 客户端。

            ---

            **许可证**：PolyForm Noncommercial 1.0.0 + 署名条款 + 禁止付费分发

            *Copyright 2026 Edwin (辰星) — https://github.com/midi-HL/telegram-mcp*
